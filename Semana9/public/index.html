<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topo">
        <h1>Atividade semana 9 | Mini Ecommerce</h1>
    </header>
    
    <main class="main">
        <section class="controles">
            <input id="search" type="text" placeholder="Buscar produto pelo nome">
            <select id="category"></select>
            <button id="btnRender">Renderizar</button>
        </section>

        <div id="product-list"></div>

        <h2>Detalhes do produto</h2>
        <div id="product-details">Ver detalhes</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
