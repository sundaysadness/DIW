<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Votação - A Fazenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="img/logo.png" class="logo me-2" alt="Logo">
            A Fazenda 2026
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link " href="index.html">Início</a>
                <a class="nav-link active" href="votacao.html">Votar</a>
                <a class="nav-link " href="resultado.html">Resultado</a>
            </div>
        </div>
    </div>
</nav>

<main class="container">

<div class="fundo-pagina">
    <h1 class="text-center mb-4">Quem você quer eliminar?</h1>
    <h2>Participantes na roça</h2>
    <div id="participantes-roca" class="row row-cols-1 row-cols-md-3 g-3"></div>
    <h2 class="mt-5">Demais participantes</h2>
    <div id="demais-participantes" class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3"></div>
    <div id="mensagem" class="mt-3"></div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>

<script>
async function carregarVotacao() {
    const naRoca = await buscarParticipantes(true);
    const demais = await buscarParticipantes(false);
    const areaRoca = document.getElementById("participantes-roca");
    const areaDemais = document.getElementById("demais-participantes");

    naRoca.forEach(p => {
        areaRoca.innerHTML += `
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="${p.foto}" class="card-img-top" alt="${p.nome}">
                    <div class="card-body">
                        <h5>${p.nome}</h5>
                        <span class="badge bg-danger mb-3">Na roça</span>
                        <button class="btn btn-danger w-100" onclick="votar(${p.id}, '${p.nome}')">
                            Votar para eliminar
                        </button>
                    </div>
                </div>
            </div>`;
    });

    demais.forEach(p => {
        areaDemais.innerHTML += `
            <div class="col">
                <div class="card card-pequeno h-100">
                    <img src="${p.foto}" class="card-img-top" alt="${p.nome}">
                    <div class="card-body p-2 text-center"><strong>${p.nome}</strong></div>
                </div>
            </div>`;
    });
}

async function votar(id, nome) {
    await registrarVoto(id);

    let quantidade = Number(sessionStorage.getItem("quantidadeVotos") || 0);
    quantidade++;
    sessionStorage.setItem("quantidadeVotos", quantidade);

    document.getElementById("mensagem").innerHTML = `
        <div class="alert alert-success">
            Voto registrado para <strong>${nome}</strong>!
            Você já votou ${quantidade} vez(es) nesta sessão.
        </div>`;
}

carregarVotacao();
</script>

</body>
</html>
